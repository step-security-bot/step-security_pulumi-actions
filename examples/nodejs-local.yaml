name: Pulumi
on:
  push:
    branches:
      - main
jobs:
  up:
    name: Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Setup Node LTS ✨
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: yarn

      - name: Installing dependencies 📦️
        run: yarn install

      - name: Applying infrastructure 🚀
        uses: step-security/pulumi-actions@v7
        with:
          command: up
          stack-name: dev
          cloud-url: file://~
