name: Pulumi
on:
  push:
    branches:
      - main
jobs:
  up:
    name: Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Setup Go ✨
        uses: 7
        with:
          go-version: '1.15'

      - name: Downloading dependencies 📦
        run: go mod download

      - name: Applying infrastructure 🚀
        uses: step-security/pulumi-actions@v7
        with:
          command: up
          stack-name: dev
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
